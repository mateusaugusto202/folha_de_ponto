<!doctype html>
<html lang="pt-br">
<head>
    <!-- Meta tags obrigatórias -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <!-- Título dinâmico da página -->
    <title>{% block title %}Sistema de Ponto{% endblock %}</title>
</head>
<body>

    <!-- ==================== BARRA DE NAVEGAÇÃO ==================== -->
    <nav class="navbar navbar-expand-lg custom-navbar mb-4">
        <div class="container-fluid">
            <!-- Logo e nome do sistema -->
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('login') }}">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" height="40" class="mr-2">
                <span>{% block logo_text %}Folha de Ponto{% endblock %}</span>
            </a>

            <!-- Botão de menu responsivo (mobile) -->
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Itens do menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ml-auto align-items-center">
                    
                    <!-- Opções disponíveis apenas para usuários logados -->
                    {% if current_user.is_authenticated %}
                        <!-- Admin tem acesso rápido ao seu ponto pessoal -->
                        {% if current_user.tipo_usuario == 'admin' %}
                            <a href="{{ url_for('area_funcionario') }}" class="btn btn-primary btn-sm mr-3">
                                <i class="fas fa-clock"></i> Meu Ponto Pessoal
                            </a>
                        {% endif %}

                        <!-- Saudação com nome do usuário -->
                        <span class="nav-item nav-link mr-3" style="color: var(--rosa-escuro) !important; font-weight: bold;">
                            Olá, {{ current_user.nome }}
                        </span>

                        <!-- Botão de logout -->
                        <a class="btn-logout" href="{{ url_for('logout') }}">Sair</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- ==================== RELÓGIO DIGITAL ==================== -->
    <!-- Exibe a hora atual do sistema em tempo real -->
    <li class="nav-item d-flex align-items-center mr-3">
        <div id="relogio-digital" class="badge badge-light p-2 {% block hide_clock %}{% endblock %}" 
            style="font-size: 1rem; color: #d63384; border: 1px solid #f8bbd0;">
            00:00:00
        </div>
    </li>

    <!-- Script para atualizar o relógio a cada segundo -->
    <script>
        function atualizarRelogio() {
            const agora = new Date();
            // Formata a hora no padrão brasileiro (HH:MM:SS)
            const tempo = agora.toLocaleTimeString('pt-BR');
            document.getElementById('relogio-digital').innerText = tempo;
        }
        // Atualiza a cada 1000ms (1 segundo)
        setInterval(atualizarRelogio, 1000);
    </script>

    <!-- ==================== CONTEÚDO PRINCIPAL ==================== -->
    <!-- Cada página injeta seu conteúdo aqui através do block content -->
    <main role="main" class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- ==================== SCRIPTS JAVASCRIPT ==================== -->
    <!-- jQuery (necessário para Bootstrap) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <!-- Bootstrap JS com Popper.js incluído -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
